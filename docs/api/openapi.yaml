openapi: 3.1.0
info:
  title: Restful-Booker API
  description: A simple booking API for testing and learning web services and software architecture.
  version: 1.0.0
servers:
  - url: http://localhost:3001
    description: Local development server
  - url: https://restful-booker.herokuapp.com
    description: Production demo server
paths:
  /ping:
    get:
      summary: Health Check
      description: A simple health check endpoint to confirm whether the API is up and running.
      responses:
        '201':
          description: Created
          content:
            text/plain:
              schema:
                type: string
                example: Created
  /auth:
    post:
      summary: Create Auth Token
      description: Creates a new authentication token to use for access to the PUT, PATCH, and DELETE /booking endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: password123
      responses:
        '200':
          description: Successful authentication or bad credentials info
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - token
                    properties:
                      token:
                        type: string
                        description: Token to use in future requests in the Cookie or Authorization header.
                        example: abc123456789012
                  - type: object
                    required:
                      - reason
                    properties:
                      reason:
                        type: string
                        description: Error message for bad credentials.
                        example: Bad credentials
  /booking:
    get:
      summary: GetBookingIds
      description: Returns the ids of all the bookings that exist within the API. Can take optional query strings to search and return a subset of booking ids.
      parameters:
        - name: firstname
          in: query
          required: false
          description: Return bookings with a specific firstname
          schema:
            type: string
            example: Sally
        - name: lastname
          in: query
          required: false
          description: Return bookings with a specific lastname
          schema:
            type: string
            example: Brown
        - name: checkin
          in: query
          required: false
          description: Return bookings that have a checkin date greater than or equal to the set checkin date. Format must be CCYY-MM-DD.
          schema:
            type: string
            format: date
            example: "2014-03-13"
        - name: checkout
          in: query
          required: false
          description: Return bookings that have a checkout date less than or equal to the set checkout date. Format must be CCYY-MM-DD.
          schema:
            type: string
            format: date
            example: "2014-05-21"
      responses:
        '200':
          description: An array of booking id objects
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    bookingid:
                      type: integer
                      description: ID of a specific booking that matches search criteria
                      example: 1
              example:
                - bookingid: 1
                - bookingid: 2
                - bookingid: 3
                - bookingid: 4
    post:
      summary: CreateBooking
      description: Creates a new booking in the API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Booking'
            example:
              firstname: Jim
              lastname: Brown
              totalprice: 111
              depositpaid: true
              bookingdates:
                checkin: "2018-01-01"
                checkout: "2019-01-01"
              additionalneeds: Breakfast
          text/xml:
            schema:
              $ref: '#/components/schemas/Booking'
      responses:
        '200':
          description: Booking successfully created, returns the booking with its new ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingWithId'
              example:
                bookingid: 1
                booking:
                  firstname: Jim
                  lastname: Brown
                  totalprice: 111
                  depositpaid: true
                  bookingdates:
                    checkin: "2018-01-01"
                    checkout: "2019-01-01"
                  additionalneeds: Breakfast
            text/xml:
              schema:
                $ref: '#/components/schemas/BookingWithId'
        '500':
          description: Internal server error due to invalid payload
  /booking/{id}:
    get:
      summary: GetBooking
      description: Returns a specific booking based upon the booking id provided
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the booking you would like to retrieve
          schema:
            type: integer
            example: 1
        - name: Accept
          in: header
          required: false
          description: "Sets what format the response body is returned in. Can be application/json or application/xml"
          schema:
            type: string
            default: application/json
            enum:
              - application/json
              - application/xml
      responses:
        '200':
          description: A booking object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              example:
                firstname: Sally
                lastname: Brown
                totalprice: 111
                depositpaid: true
                bookingdates:
                  checkin: "2013-02-23"
                  checkout: "2014-10-23"
                additionalneeds: Breakfast
            application/xml:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          description: Booking not found
        '418':
          description: Unsupported media type requested via Accept header
    put:
      summary: UpdateBooking
      description: Updates a current booking with a full payload. Requires authentication via token cookie or Basic Auth.
      security:
        - cookieAuth: []
        - basicAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the booking you would like to update
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Booking'
            example:
              firstname: James
              lastname: Brown
              totalprice: 111
              depositpaid: true
              bookingdates:
                checkin: "2018-01-01"
                checkout: "2019-01-01"
              additionalneeds: Breakfast
          text/xml:
            schema:
              $ref: '#/components/schemas/Booking'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Booking'
      responses:
        '200':
          description: Booking successfully updated, returns the updated booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              example:
                firstname: James
                lastname: Brown
                totalprice: 111
                depositpaid: true
                bookingdates:
                  checkin: "2018-01-01"
                  checkout: "2019-01-01"
                additionalneeds: Breakfast
            text/xml:
              schema:
                $ref: '#/components/schemas/Booking'
        '403':
          description: Forbidden – missing or invalid authentication token
        '405':
          description: Method not allowed
    patch:
      summary: PartialUpdateBooking
      description: Updates a current booking with a partial payload. Requires authentication via token cookie or Basic Auth.
      security:
        - cookieAuth: []
        - basicAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the booking you would like to partially update
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Booking'
            example:
              firstname: James
              lastname: Brown
          text/xml:
            schema:
              $ref: '#/components/schemas/Booking'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Booking'
      responses:
        '200':
          description: Booking successfully updated, returns the updated booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
            text/xml:
              schema:
                $ref: '#/components/schemas/Booking'
        '403':
          description: Forbidden – missing or invalid authentication token
        '405':
          description: Method not allowed
    delete:
      summary: DeleteBooking
      description: Deletes a booking from the API. Requires authentication via token cookie or Basic Auth.
      security:
        - cookieAuth: []
        - basicAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the booking you would like to delete
          schema:
            type: integer
            example: 1
      responses:
        '201':
          description: Booking successfully deleted
        '403':
          description: Forbidden – missing or invalid authentication token
        '405':
          description: Method not allowed
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: Token obtained from POST /auth, passed as a cookie header
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Auth using admin:password123
  schemas:
    Booking:
      type: object
      required:
        - firstname
        - lastname
        - totalprice
        - depositpaid
        - bookingdates
      properties:
        firstname:
          type: string
          description: Firstname for the guest who made the booking
          example: Jim
        lastname:
          type: string
          description: Lastname for the guest who made the booking
          example: Brown
        totalprice:
          type: number
          description: The total price for the booking
          example: 111
        depositpaid:
          type: boolean
          description: Whether the deposit has been paid or not
          example: true
        bookingdates:
          type: object
          required:
            - checkin
            - checkout
          properties:
            checkin:
              type: string
              format: date
              description: Date the guest is checking in
              example: "2018-01-01"
            checkout:
              type: string
              format: date
              description: Date the guest is checking out
              example: "2019-01-01"
        additionalneeds:
          type: string
          description: Any other needs the guest has
          example: Breakfast
    BookingWithId:
      type: object
      properties:
        bookingid:
          type: integer
          description: ID for newly created booking
          example: 1
        booking:
          $ref: '#/components/schemas/Booking'
